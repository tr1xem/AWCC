name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config git meson \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev wayland-protocols \
            libwayland-dev libwayland-egl-backend-dev libgl-dev libudev-dev \
            python3

      - name: Configure, build, and test
        run: |
          cmake -S . -B build -G Ninja -DAWCC_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
